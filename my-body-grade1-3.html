ปกป้องร่างกาย", "ic": "🖐️"}, {"w": "bone", "t": "กระดูก", "s": "Bones support my body.", "st": "กระดูกช่วยพยุงร่างกาย", "ic": "🦴"}, {"w": "muscle", "t": "กล้ามเนื้อ", "s": "Muscles help my body move.", "st": "กล้ามเนื้อช่วยให้ร่างกายเคลื่อนไหว", "ic": "💪"}, {"w": "brain", "t": "สมอง", "s": "My brain helps me think and learn.", "st": "สมองช่วยให้ฉันคิดและเรียนรู้", "ic": "🧠"}, {"w": "heart", "t": "หัวใจ", "s": "My heart pumps blood around my body.", "st": "หัวใจสูบฉีดเลือดไปทั่วร่างกาย", "ic": "❤️"}, {"w": "lung", "t": "ปอด", "s": "My lungs help me breathe.", "st": "ปอดช่วยให้ฉันหายใจ", "ic": "🫁"}, {"w": "stomach", "t": "กระเพาะอาหาร", "s": "My stomach helps digest food.", "st": "กระเพาะอาหารช่วยย่อยอาหาร", "ic": "🍽️"}, {"w": "blood", "t": "เลือด", "s": "Blood carries oxygen and nutrients around my body.", "st": "เลือดลำเลียงออกซิเจนและสารอาหารไปทั่วร่างกาย", "ic": "🩸"}, {"w": "breathe", "t": "หายใจ", "s": "I breathe air in and out.", "st": "ฉันหายใจเอาอากาศเข้าและออก", "ic": "🌬️"}, {"w": "see", "t": "มองเห็น", "s": "I see with my eyes.", "st": "ฉันมองเห็นด้วยตา", "ic": "👀"}, {"w": "hear", "t": "ได้ยิน", "s": "I hear sounds with my ears.", "st": "ฉันได้ยินเสียงด้วยหู", "ic": "👂"}, {"w": "smell", "t": "ดมกลิ่น", "s": "I smell with my nose.", "st": "ฉันดมกลิ่นด้วยจมูก", "ic": "👃"}, {"w": "taste", "t": "รับรส", "s": "I taste food with my tongue.", "st": "ฉันรับรสอาหารด้วยลิ้น", "ic": "👅"}, {"w": "touch", "t": "สัมผัส", "s": "I can touch things with my hands.", "st": "ฉันสามารถสัมผัสสิ่งของด้วยมือ", "ic": "✋"}, {"w": "move", "t": "เคลื่อนไหว", "s": "My muscles and bones help me move.", "st": "กล้ามเนื้อและกระดูกช่วยให้ฉันเคลื่อนไหว", "ic": "🏃"}, {"w": "healthy", "t": "สุขภาพดี", "s": "Food, sleep, and exercise help keep my body healthy.", "st": "อาหาร การนอน และการออกกำลังกายช่วยให้ร่างกายแข็งแรง", "ic": "💚"}],S=speechSynthesis,$=id=>document.getElementById(id);let qs=[],idx=0,run=0,answered=false,paused=false,pauseWaiters=[],edgeStep=0,edgeTimer=null;

let audioCtx=null;
function chameleonHiss(kind="soft"){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const dur=kind==="soft"?0.32:0.52, sr=audioCtx.sampleRate, buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr), a=buf.getChannelData(0);
    for(let i=0;i<a.length;i++){const t=i/a.length, env=Math.sin(Math.PI*t);a[i]=(Math.random()*2-1)*env*(kind==="soft"?.22:.30)}
    const src=audioCtx.createBufferSource(), filter=audioCtx.createBiquadFilter(), gain=audioCtx.createGain();
    filter.type="bandpass";filter.frequency.value=kind==="soft"?2800:1900;filter.Q.value=.75;gain.gain.value=.82;
    src.buffer=buf;src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);src.start();
    return new Promise(r=>setTimeout(r,dur*1000));
  }catch(e){return Promise.resolve()}
}

const sleep=ms=>new Promise(async resolve=>{let left=ms,last=Date.now();while(left>0){if(paused)await new Promise(r=>pauseWaiters.push(r));let now=Date.now();left-=now-last;last=now;if(left>0)await new Promise(r=>setTimeout(r,Math.min(50,left)))}resolve()});
function say(text,lang="th-TH",rate=.85){return new Promise(res=>{let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.onend=res;u.onerror=res;S.speak(u)})}
function stop(){S.cancel();run++}
function edgeMove(){if(answered||paused)return;let c=$("cham"),m=8,x=[m,innerWidth-55,innerWidth-55,m][edgeStep%4],y=[m,m,innerHeight-58,innerHeight-58][edgeStep%4];c.className="";c.style.left=x+"px";c.style.top=y+"px";c.style.opacity="1";edgeStep++}
function startEdge(){clearInterval(edgeTimer);$("cham").style.fontSize="42px";edgeMove();edgeTimer=setInterval(edgeMove,950)}
async function reaction(ok){clearInterval(edgeTimer);let c=$("cham");c.style.opacity="1";c.className="front "+(ok?"laugh":"cry");await sleep(350);if(ok)await chameleonHiss("soft");else{tears();await chameleonHiss("warning")}await sleep(650);c.style.left=(innerWidth+150)+"px";c.style.top="48%";c.style.transform="translate(0,-50%)";c.style.opacity="0";await sleep(450);c.className="";c.style.transform="";c.style.fontSize="42px"}
function tears(){let r=$("cham").getBoundingClientRect();for(let j=0;j<7;j++){let t=document.createElement("span");t.className="tear";t.textContent="💧";t.style.left=(r.left+r.width*.35+j*7)+"px";t.style.top=(r.top+r.height*.30)+"px";document.body.appendChild(t);setTimeout(()=>t.remove(),900)}}
let c=10;$("count").textContent="เริ่มอัตโนมัติใน "+c;let ct=setInterval(()=>{c--;$("count").textContent=c>0?"เริ่มอัตโนมัติใน "+c:"";if(c<=0){clearInterval(ct);enter()}},1000);
function enter(){clearInterval(ct);$("cover").classList.add("hide");$("game").classList.remove("hide");restart()}
function restart(){stop();qs=[...DATA].sort(()=>Math.random()-.5);idx=0;$("result").classList.add("hide");$("game").classList.remove("hide");startEdge();question()}
function opts(q){return[q,...DATA.filter(x=>x.t!==q.t).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5)}
async function question(){if(idx>=qs.length)return finish();answered=false;paused=false;$("pauseBtn").textContent="⏸ หยุด";startEdge();let q=qs[idx],o=opts(q);window.cur={q,o};$("prog").textContent=`ข้อ ${idx+1} / 50`;$("word").textContent=q.w;$("reveal").innerHTML="";$("choices").innerHTML="";o.forEach((x,k)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${k+1}. ${x.t}`;b.addEventListener("click",()=>tap(k));$("choices").appendChild(b)});let r=++run;await say("ข้อใดแปลว่า");if(r!==run||answered)return;await say(q.w,"en-US",.82);for(let k=0;k<4;k++){if(r!==run||answered)return;hi(k);await say("ข้อ "+(k+1));if(r!==run||answered)return;await sleep(130);await say(o[k].t)}hi(-1);for(let n=1;n<=3;n++){if(r!==run||answered)return;await say(String(n));await sleep(400)}if(r===run&&!answered)showAnswer(false)}
function hi(k){document.querySelectorAll(".choice").forEach((b,j)=>b.classList.toggle("on",j===k))}
async function tap(k){if(answered)return;answered=true;stop();hi(-1);let {q,o}=cur,bs=[...document.querySelectorAll(".choice")];bs.forEach(b=>b.disabled=true);let ok=o[k].t===q.t;bs[k].classList.add(ok?"ok":"no");await reaction(ok);if(!ok)bs[o.findIndex(x=>x.t===q.t)].classList.add("ok");await showAnswer(true)}
async function showAnswer(fromTap){answered=true;stop();clearInterval(edgeTimer);let {q,o}=cur,bs=[...document.querySelectorAll(".choice")],k=o.findIndex(x=>x.t===q.t);bs.forEach(b=>b.disabled=true);bs[k].classList.add("ok");
let target=bs[k].getBoundingClientRect(), cham=$("cham");
cham.className="";cham.style.opacity="1";cham.style.fontSize="58px";cham.style.transform="";
cham.style.left=Math.max(4,Math.min(innerWidth-62,target.right-50))+"px";
cham.style.top=Math.max(4,target.top+target.height/2-28)+"px";
$("reveal").innerHTML=`<div class="learn"><div class="pic">${q.ic}</div><h2>${q.w}</h2><div class="thai">${q.t}</div><div class="label">📝 ตัวอย่างประโยค</div><div class="sent">${q.s}</div><div class="sentth">${q.st}</div></div>`;let r=++run;await say("เฉลย");if(r!==run)return;await say("ข้อ "+(k+1));if(r!==run)return;await say(q.w,"en-US",.82);if(r!==run)return;await say(q.t);if(r!==run)return;await sleep(220);await say(q.s,"en-US",.82);if(r!==run)return;await sleep(3000);if(r===run){idx++;question()}}
function replay(){if(!answered){stop();question()}}
function togglePause(){paused=!paused;if(paused){S.pause();clearInterval(edgeTimer);$("pauseBtn").textContent="▶ เล่นต่อ"}else{S.resume();$("pauseBtn").textContent="⏸ หยุด";let w=[...pauseWaiters];pauseWaiters=[];w.forEach(r=>r());startEdge()}}
async function shareGame(){try{if(navigator.share)await navigator.share({title:"My Body Vocabulary Challenge",text:"เกมคำศัพท์ระบบสุริยะ",url:location.href});else{await navigator.clipboard.writeText(location.href);alert("คัดลอกลิงก์แล้ว")}}catch(e){}}
function finish(){stop();clearInterval(edgeTimer);$("game").classList.add("hide");$("result").classList.remove("hide")}
$("enterBtn").addEventListener("click",enter);$("restartBtn").addEventListener("click",restart);$("pauseBtn").addEventListener("click",togglePause);$("replayBtn").addEventListener("click",replay);$("shareBtn").addEventListener("click",shareGame);
</script></body></html>
