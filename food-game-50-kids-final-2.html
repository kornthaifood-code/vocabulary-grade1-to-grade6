<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Food & Snacks Vocabulary — 50 Words</title>
<style>
:root{--ink:#4e5369;--pink:#ffdce9;--blue:#dff3ff;--mint:#d9f7eb;--lav:#ebe3ff;--yellow:#fff1bf;--ok:#2f9b63;--bad:#d65a7b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,"Noto Sans Thai",Arial,sans-serif;background:linear-gradient(145deg,#fff8fc,#eefcff);color:var(--ink)}
body{display:grid;place-items:center}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:min(100vw,430px);height:100dvh;max-height:900px;overflow:hidden;background:rgba(255,255,255,.95)}
.screen{position:absolute;inset:0;display:none;overflow:hidden}.screen.show{display:grid}

/* COVER */
#home{padding:0;place-items:stretch;background:#dff7ff}
.coverBtn{position:absolute;inset:0;border:0;padding:0;background:#dff7ff;cursor:pointer}
.coverBtn img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.tapHint{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.90);border-radius:999px;padding:7px 13px;font-size:11px;font-weight:900;box-shadow:0 5px 15px rgba(40,70,90,.16);pointer-events:none}

/* GAME */
#game{padding:12px 13px 10px;grid-template-rows:auto auto 8px minmax(0,1fr) auto;gap:7px}
.top{display:grid;grid-template-columns:42px 1fr 76px;gap:7px;align-items:center}.back{border:0;border-radius:14px;min-height:42px;background:#f1edff;font-weight:900}
.title{min-width:0}.title b{display:block;font-size:16px;color:#676b9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title small{display:block;font-size:10px;color:#818698}
.score{text-align:center;background:linear-gradient(#fff,var(--blue));border-radius:15px;padding:5px}.score small{display:block;font-size:8px}.score strong{font-size:22px}
.stats{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px}.stat{background:#fff;border:1px solid #ece9f4;border-radius:13px;text-align:center;padding:5px;min-width:0}.stat small{display:block;font-size:8px}.stat b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{background:#eeeaf7;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#f6aecb,#9fe4cc);transition:.2s}
.card{min-height:0;background:linear-gradient(165deg,#fff,#fffdf7);border:1px solid #ece9f4;border-radius:24px;padding:9px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px;overflow:hidden;box-shadow:0 10px 24px rgba(80,90,130,.08)}
.cat{justify-self:center;background:linear-gradient(90deg,var(--yellow),var(--lav));border-radius:99px;padding:4px 11px;font-size:10px;font-weight:900;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroRow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:center}.pic{height:82px;border-radius:20px;background:linear-gradient(145deg,#fff8db,#fff,var(--mint));display:grid;place-items:center;font-size:50px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.word{font-size:clamp(38px,11vw,52px);font-weight:1000;color:#5f638f;line-height:.98;letter-spacing:-1px;overflow-wrap:anywhere}.word.long{font-size:clamp(31px,8.7vw,43px)}.word.xlong{font-size:clamp(27px,7.6vw,38px)}
.ask{font-size:15px;font-weight:900;margin-top:6px}.listen{margin-top:7px;border:0;border-radius:13px;padding:8px 10px;background:linear-gradient(90deg,var(--blue),var(--mint));font-size:12px;font-weight:900;color:var(--ink)}
.answers{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;min-height:0}.ans{border:1px solid #ece9f4;border-radius:17px;background:#fff;padding:8px;display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:center;text-align:left;font-size:16px;font-weight:900;line-height:1.18;color:var(--ink);box-shadow:0 4px 10px rgba(80,90,130,.07);overflow:hidden}.letter{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f2eefc;font-size:12px}.ans.correct{outline:3px solid #9bd9b2;background:#effaf3}.ans.wrong{outline:3px solid #efabc0;background:#fff2f6}
.feedback{min-height:46px;border-radius:14px;background:#faf9ff;padding:6px;text-align:center;display:grid;place-items:center;font-size:13px;line-height:1.28}.feedback strong{display:block;font-size:15px}.feedback.ok strong{color:var(--ok)}.feedback.no strong{color:var(--bad)}
.foot{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px}.foot button{border:0;border-radius:14px;min-height:42px;background:#f4f0ff;font-weight:900;color:var(--ink);font-size:12px}.foot .next{background:linear-gradient(90deg,var(--pink),var(--blue))}
#result{padding:14px;place-items:center;text-align:center}.resultCard{background:#fff;border:1px solid #ece9f4;border-radius:28px;padding:24px;width:100%}.resultCard .big{font-size:64px}.resultCard h2{font-size:28px;color:#676b9a;margin:5px}.resultCard p{font-size:18px;line-height:1.6}.resultCard button{border:0;border-radius:16px;min-height:50px;padding:10px 18px;font-weight:900;font-size:16px;background:linear-gradient(90deg,var(--pink),var(--blue),var(--mint));color:var(--ink)}
.cham{position:absolute;z-index:20;width:50px;height:34px;pointer-events:none;offset-path:inset(6px round 24px);offset-distance:0%;animation:walk 14s linear infinite}@keyframes walk{to{offset-distance:100%}}.cham svg{width:100%;height:100%}

@media(max-height:720px){
 #game{padding:9px 11px 8px;gap:5px}.top{grid-template-columns:38px 1fr 68px}.back{min-height:36px}.score strong{font-size:19px}.stats{gap:4px}.card{padding:7px;gap:5px}.heroRow{grid-template-columns:72px 1fr;gap:8px}.pic{height:66px;font-size:40px}.word{font-size:clamp(34px,10vw,46px)}.word.long{font-size:clamp(29px,8vw,39px)}.word.xlong{font-size:clamp(25px,7vw,34px)}.ask{font-size:13px;margin-top:4px}.listen{padding:6px 8px;margin-top:5px}.answers{gap:6px}.ans{font-size:14px;padding:6px;grid-template-columns:27px 1fr}.letter{width:25px;height:25px}.feedback{min-height:38px;font-size:11px}.feedback strong{font-size:13px}.foot button{min-height:36px}
}
@media(max-height:610px){
 .stats{display:none}.heroRow{grid-template-columns:60px 1fr}.pic{height:54px;font-size:33px}.word{font-size:30px}.word.long{font-size:27px}.word.xlong{font-size:24px}.ask{font-size:11px}.listen{font-size:10px;padding:5px 7px}.ans{font-size:11px;padding:5px}.feedback{min-height:30px;font-size:10px}.foot button{min-height:32px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){.cham{animation:none;left:7px;top:7px}}
</style>
</head>

nana", "thai": "กล้วย", "emoji": "🍌", "cat": "ผลไม้", "funny": "กล้วยเต้นระบำ 😂"}, {"word": "strawberry", "thai": "สตรอว์เบอร์รี", "emoji": "🍓", "cat": "ผลไม้", "funny": null}, {"word": "blueberry", "thai": "บลูเบอร์รี", "emoji": "🫐", "cat": "ผลไม้", "funny": null}, {"word": "mango", "thai": "มะม่วง", "emoji": "🥭", "cat": "ผลไม้", "funny": null}, {"word": "watermelon", "thai": "แตงโม", "emoji": "🍉", "cat": "ผลไม้", "funny": "แตงโมติดจรวด 😂"}, {"word": "grapes", "thai": "องุ่น", "emoji": "🍇", "cat": "ผลไม้", "funny": null}, {"word": "corn", "thai": "ข้าวโพด", "emoji": "🌽", "cat": "ผักและธัญพืช", "funny": null}];
const home=document.getElementById('home'),game=document.getElementById('game'),result=document.getElementById('result');
const wordEl=document.getElementById('word'),pic=document.getElementById('pic'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback');
const scoreEl=document.getElementById('score'),correctEl=document.getElementById('correct'),countEl=document.getElementById('count'),bar=document.getElementById('bar');
const category=document.getElementById('category'),catPill=document.getElementById('catPill'),nextBtn=document.getElementById('nextBtn');
let deck=[],idx=0,score=0,locked=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(s){[home,game,result].forEach(x=>x.classList.remove('show'));s.classList.add('show')}
function start(){deck=shuffle(DATA);idx=0;score=0;scoreEl.textContent='0';correctEl.textContent='0';show(game);render()}
function wordSizeClass(w){return w.length>14?'word xlong':w.length>10?'word long':'word'}
function render(){
 locked=false;nextBtn.disabled=true;feedback.className='feedback';feedback.textContent='เลือกคำตอบ 1 ข้อ';
 const q=deck[idx];wordEl.className=wordSizeClass(q.word);wordEl.textContent=q.word;pic.textContent=q.emoji;
 category.textContent=q.cat;catPill.textContent='🍪 '+q.cat;countEl.textContent=`${idx+1} / 50`;bar.style.width=`${((idx+1)/50)*100}%`;
 const pool=shuffle(DATA.filter(x=>x.word!==q.word && x.thai!==q.thai)).map(x=>x.thai);
 let opts=[q.thai];
 for(const t of pool){if(!opts.includes(t))opts.push(t);if(opts.length===4)break}
 if(q.funny && Math.random()<0.55){let pos=Math.floor(Math.random()*3)+1;opts[pos]=q.funny}
 opts=shuffle(opts);answers.innerHTML='';
 opts.forEach((text,i)=>{const b=document.createElement('button');b.className='ans';b.type='button';b.innerHTML=`<span class="letter">${['A','B','C','D'][i]}</span><span class="label">${text}</span>`;b.addEventListener('click',()=>answer(b,text));answers.appendChild(b)})
}
function answer(btn,text){
 if(locked)return;locked=true;const q=deck[idx],ok=text===q.thai;
 [...answers.children].forEach(b=>{b.disabled=true;const t=b.querySelector('.label').textContent;if(t===q.thai)b.classList.add('correct')})
 if(ok){score++;scoreEl.textContent=score;correctEl.textContent=score;feedback.className='feedback ok';feedback.innerHTML=`<div><strong>✅ ถูกต้อง</strong>${q.word} = ${q.thai}</div>`}
 else{btn.classList.add('wrong');feedback.className='feedback no';feedback.innerHTML=`<div><strong>❌ ผิด</strong>เฉลย: ${q.word} = ${q.thai}</div>`}
 nextBtn.disabled=false
}
function next(){if(idx<49){idx++;render()}else finish()}
function finish(){show(result);document.getElementById('resultText').innerHTML=`คะแนน <b>${score} / 50</b><br>ตอบถูก ${score} ข้อ<br>${Math.round(score/50*100)}%`}
function speak(){
 if(!('speechSynthesis' in window)){feedback.textContent='เบราว์เซอร์นี้ไม่รองรับเสียง แต่ยังเล่นเกมได้';return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(deck[idx].word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)
}
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('backBtn').addEventListener('click',()=>show(home));
document.getElementById('listenBtn').addEventListener('click',speak);
document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('skipBtn').addEventListener('click',()=>{if(idx<49){idx++;render()}else finish()});
document.getElementById('restartBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
