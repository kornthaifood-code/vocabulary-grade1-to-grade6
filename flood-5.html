<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flood Vocabulary Challenge</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061d31;font-family:system-ui,"Noto Sans Thai",sans-serif;color:#fff}button{font:inherit;touch-action:manipulation}.stage{position:relative;margin:auto;width:min(100vw,56.25vh);height:100dvh;background:linear-gradient(#17466d,#107b91 48%,#07506e);overflow:hidden}.safe{position:absolute;inset:7% 15% 20% 7%;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:3}.hide{display:none!important}.tag{font-weight:1000;color:#c8fbff;letter-spacing:1px;font-size:clamp(11px,1.8vh,21px)}h1{font-size:clamp(35px,6vh,72px);line-height:.92;margin:1vh;text-shadow:0 5px #07334e}.scene{font-size:clamp(50px,8vh,95px)}.kids{font-size:clamp(70px,11vh,135px);filter:drop-shadow(0 8px 7px #0008);margin:1vh}.pill,.badge{background:#ffffff20;border:1px solid #ffffff35;border-radius:999px;padding:.7vh 1.2vw;font-weight:900;font-size:clamp(11px,1.7vh,19px)}.enter{border:0;border-radius:17px;padding:1.2vh 5vw;margin-top:2vh;background:linear-gradient(#d8fff8,#72e6d3);color:#073c49;font-weight:1000;font-size:clamp(17px,2.5vh,29px);box-shadow:0 7px #287f89}.top{display:flex;width:100%;justify-content:space-between}.prompt{margin-top:2vh;font-weight:900;color:#c9faff;font-size:clamp(15px,2.2vh,25px)}.word{font-size:clamp(40px,6.5vh,76px);font-weight:1000;margin:.5vh 0 1vh;text-shadow:0 5px #062b43}.choices{display:grid;grid-template-columns:1fr 1fr;gap:1vh;width:100%}.choice{min-height:7.2vh;border:0;border-radius:16px;background:linear-gradient(#fff,#dceef2);color:#12313c;font-weight:900;box-shadow:0 5px #779aa5;font-size:clamp(14px,2vh,23px)}.choice span{display:block;font-size:.7em;opacity:.6}.speak{outline:4px solid #ffe074}.good{background:#8df0af!important}.bad{background:#ff9e9e!important}.status{height:3vh;color:#ffe47b;font-weight:1000;font-size:clamp(15px,2.3vh,27px)}.learn{width:100%;background:#effef9;color:#123b42;border-radius:17px;padding:1vh;font-size:clamp(12px,1.65vh,19px);box-shadow:0 8px 20px #0006}.ico{font-size:clamp(28px,4vh,50px)}.big{font-size:clamp(22px,3.2vh,38px);font-weight:1000}.th{font-size:clamp(16px,2.3vh,27px);font-weight:900}.ex{border-top:1px solid #789b9b;margin-top:.5vh;padding-top:.5vh;font-weight:800}.controls{margin-top:auto;display:flex;gap:5px}.ctrl{border:0;border-radius:11px;padding:.8vh 1vw;background:#ffffff20;color:#fff;font-weight:900;font-size:clamp(10px,1.5vh,17px)}.cham{position:absolute;z-index:10;font-size:clamp(30px,4vh,48px);left:3%;top:4%;transition:left .6s,top .6s,transform .25s;filter:drop-shadow(0 4px 3px #0008)}.reaction{position:absolute;z-index:11;left:43%;top:35%;font-size:clamp(27px,4vh,48px)}.finish{justify-content:center}.trophy{font-size:clamp(70px,12vh,145px)}.wave{position:absolute;bottom:-4%;left:-15%;width:130%;height:28%;background:#4fc6d755;border-radius:50% 50% 0 0}</style></head><body><main class="stage"><div class="wave"></div><div id="cham" class="cham">🦎</div><div id="react" class="reaction"></div>
<section id="cover" class="safe"><div class="tag">VOCABULARY CHALLENGE • 3D</div><div class="scene">🌧️🌊🛟</div><h1>เกมน้ำท่วม<br><span style="color:#9ef7ed">FLOOD</span></h1><div>เรียนรู้คำศัพท์เพื่อความปลอดภัย</div><div class="kids">👧🏻 👧🏻</div><div><span class="pill">LISTEN • GUESS • TAP</span> <span class="pill">5 WORDS</span></div><button id="enter" class="enter">▶ เข้าเกม</button><div id="opening" style="margin-top:1vh;font-weight:800">เข้าเกมอัตโนมัติใน 10</div></section>
<section id="game" class="safe hide"><div class="top"><span id="prog" class="badge"></span><span class="badge">🌊 FLOOD</span></div><div class="prompt">🎧 ข้อใดแปลว่า</div><div id="word" class="word"></div><div id="choices" class="choices"></div><div id="status" class="status"></div><div id="learn" class="learn hide"></div><div class="controls"><button id="pause" class="ctrl">⏸ หยุด</button><button id="replay" class="ctrl">🔁 ฟังใหม่</button><button id="share" class="ctrl">📤 แชร์</button></div></section>
<section id="finish" class="safe finish hide"><div class="trophy">🏆🌊</div><h1>เก่งมาก!</h1><div>เรียนรู้ครบ 5 คำแล้ว</div><button id="again" class="enter">🔁 เล่นอีกครั้ง</button></section></main>
<script>const DATA=[{"word": "flood", "thai": "น้ำท่วม", "thaiSpeech": "น้ำท่วม", "phonics": "FLUHD", "pron": "ฟลัด", "sentence": "The flood covers the road.", "sentenceTh": "น้ำท่วมปกคลุมถนน", "icon": "🌊", "choices": ["น้ำท่วม", "ฝน", "ช่วยเหลือ", "อพยพ"], "correct": 0}, {"word": "rain", "thai": "ฝน", "thaiSpeech": "ฝน", "phonics": "RAYN", "pron": "เรน", "sentence": "Heavy rain can cause a flood.", "sentenceTh": "ฝนตกหนักอาจทำให้เกิดน้ำท่วม", "icon": "🌧️", "choices": ["น้ำท่วม", "ช่วยเหลือ", "อพยพ", "ฝน"], "correct": 3}, {"word": "rescue", "thai": "ช่วยเหลือ", "thaiSpeech": "ช่วยเหลือ", "phonics": "RES-kyoo", "pron": "เรส-คิว", "sentence": "Rescue workers help people safely.", "sentenceTh": "เจ้าหน้าที่กู้ภัยช่วยเหลือผู้คนอย่างปลอดภัย", "icon": "🛟", "choices": ["ฝน", "อพยพ", "ช่วยเหลือ", "น้ำท่วม"], "correct": 2}, {"word": "evacuate", "thai": "อพยพ", "thaiSpeech": "อพยพ", "phonics": "ih-VAK-yoo-ayt", "pron": "อิ-แวค-ยู-เอท", "sentence": "We evacuate to a safe place.", "sentenceTh": "เราอพยพไปยังสถานที่ปลอดภัย", "icon": "🏃", "choices": ["ช่วยเหลือ", "อพยพ", "น้ำท่วม", "ฝน"], "correct": 1}, {"word": "shelter", "thai": "ที่พักพิง", "thaiSpeech": "ที่พักพิง", "phonics": "SHEL-ter", "pron": "เชล-เทอร์", "sentence": "The shelter is on higher ground.", "sentenceTh": "ที่พักพิงอยู่บนพื้นที่สูง", "icon": "🏠", "choices": ["ที่พักพิง", "น้ำท่วม", "ฝน", "ช่วยเหลือ"], "correct": 0}],$=x=>document.getElementById(x);let qs=[],idx=0,locked=false,paused=false,run=0,timers=[],edge=0,edgeTimer;
const sleep=ms=>new Promise(r=>{let t=setTimeout(r,ms);timers.push(t)});function cancel(){run++;timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}}
function voice(l){let v=speechSynthesis.getVoices();return v.find(x=>x.lang===l&&/Google|Microsoft|Premium/i.test(x.name))||v.find(x=>x.lang===l)||v.find(x=>x.lang.startsWith(l.slice(0,2)))||null}
function say(t,l="th-TH",rate=.85){return new Promise(done=>{if(paused)return done();try{let u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=rate;u.voice=voice(l);u.onend=done;u.onerror=done;speechSynthesis.speak(u)}catch(e){done()}})}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function perimeter(){clearInterval(edgeTimer);let c=$("cham");c.style.transform="";let p=[["77%","4%"],["77%","76%"],["3%","76%"],["3%","4%"]];let go=()=>{let q=p[edge++%4];c.style.left=q[0];c.style.top=q[1]};go();edgeTimer=setInterval(go,850)}
function hiss(){try{let A=new(AudioContext||webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type="sawtooth";o.frequency.value=130;g.gain.setValueAtTime(.001,A.currentTime);g.gain.exponentialRampToValueAtTime(.82,A.currentTime+.04);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.34);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+.36)}catch(e){}}
function reaction(ok){clearInterval(edgeTimer);let c=$("cham");c.style.left="43%";c.style.top="40%";c.style.transform="scale(2.6)";$("react").textContent=ok?"😄✨":"😭💦";hiss()}function perch(n){let b=document.querySelectorAll(".choice")[n],r=b.getBoundingClientRect(),s=document.querySelector(".stage").getBoundingClientRect(),c=$("cham");c.style.left=Math.min(r.right-s.left-42,s.width*.75)+"px";c.style.top=(r.top-s.top-28)+"px";c.style.transform="scale(1.2)";$("react").textContent=""}
function start(){cancel();$("cover").classList.add("hide");$("finish").classList.add("hide");$("game").classList.remove("hide");qs=shuffle(DATA);idx=0;paused=false;$("pause").textContent="⏸ หยุด";render()}function render(){cancel();locked=false;$("learn").classList.add("hide");$("status").textContent="";let q=qs[idx];$("prog").textContent=`ข้อ ${idx+1} / 5`;$("word").textContent=q.word;$("choices").innerHTML=q.choices.map((x,i)=>`<button class="choice" onclick="tap(${i})"><span>ข้อ ${i+1}</span>${x}</button>`).join("");perimeter();let mine=++run;sequence(mine)}
async function sequence(m){let q=qs[idx],bs=[...document.querySelectorAll(".choice")];await say("ข้อใดแปลว่า");if(m!==run)return;await say(q.word,"en-US",.82);if(m!==run)return;for(let i=0;i<4;i++){bs[i].classList.add("speak");await say("ข้อ "+(i+1));await sleep(140);await say(q.choices[i]);bs[i].classList.remove("speak");if(m!==run)return}for(let n of [1,2,3]){$("status").textContent=n;await say(String(n));await sleep(500);if(m!==run)return}await reveal(false)}
async function tap(n){if(locked||paused)return;locked=true;cancel();let q=qs[idx],ok=n===q.correct,bs=[...document.querySelectorAll(".choice")];if(ok)bs[n].classList.add("good");else{bs[n].classList.add("bad");bs[q.correct].classList.add("good")}reaction(ok);await sleep(650);perch(q.correct);await reveal(true)}
async function reveal(tapped){if(!tapped){if(locked)return;locked=true;cancel()}let q=qs[idx],bs=[...document.querySelectorAll(".choice")];$("status").textContent="เฉลย";await say("เฉลย");await say("ข้อ "+(q.correct+1));await say(q.word,"en-US",.82);await say(q.thaiSpeech);bs[q.correct].classList.add("good");perch(q.correct);$("learn").innerHTML=`<div class="ico">${q.icon}</div><div class="big">${q.word}</div><div class="th">${q.thai}</div><div>🔤 ${q.phonics} • ${q.pron}</div><div class="ex">📝 ตัวอย่างประโยค<br><b>${q.sentence}</b><br>${q.sentenceTh}</div>`;$("learn").classList.remove("hide");await say(q.sentence,"en-US",.8);await sleep(3000);if(paused)return;idx++;if(idx>=qs.length){clearInterval(edgeTimer);$("game").classList.add("hide");$("finish").classList.remove("hide")}else render()}
$("pause").onclick=()=>{paused=!paused;if(paused){clearInterval(edgeTimer);try{speechSynthesis.pause()}catch(e){};$("pause").textContent="▶ เล่นต่อ"}else{try{speechSynthesis.resume()}catch(e){};$("pause").textContent="⏸ หยุด";render()}};$("replay").onclick=()=>{if(!paused)render()};$("share").onclick=async()=>{let d={title:"Flood Vocabulary Challenge",text:"เกมคำศัพท์เรื่องน้ำท่วม 5 คำ",url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);alert("คัดลอกลิงก์แล้ว")}}catch(e){}};$("again").onclick=start;
let sec=10,ot=setInterval(()=>{sec--;$("opening").textContent=sec>0?"เข้าเกมอัตโนมัติใน "+sec:"กำลังเข้าเกม…";if(sec<=0){clearInterval(ot);start()}},1000);function enter(){clearInterval(ot);start()}$("enter").onclick=enter;$("enter").addEventListener("touchend",e=>{e.preventDefault();enter()},{passive:false});</script></body></html>
