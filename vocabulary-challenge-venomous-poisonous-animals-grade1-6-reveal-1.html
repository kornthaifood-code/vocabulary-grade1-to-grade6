<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vocabulary Challenge — สัตว์ที่มีพิษ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(#c7f5df,#dbeeff 60%,#fff0b8);color:#173e47;overflow-x:hidden}.app{max-width:520px;min-height:100dvh;margin:auto;padding:14px}.card{background:#ffffffed;border:3px solid #fff;border-radius:28px;padding:17px;text-align:center;box-shadow:0 13px 30px #315e6a35}.cover{min-height:calc(100dvh - 28px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(155deg,#aaf0d4,#b9dcff,#ffe5a4)}h1{font-size:clamp(35px,10vw,54px);line-height:.9;margin:8px;color:#456bc5;text-shadow:0 4px white,0 8px 10px #607ab344}.topic{font-size:33px;font-weight:1000;color:#e66d8b}.hero{font-size:59px;margin:12px}.tag{font-size:18px;font-weight:900}.levels{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{border:0;border-radius:17px;padding:12px;font-size:16px;font-weight:900;background:#d9d1ff;box-shadow:0 5px 0 #9a91be;touch-action:manipulation}.top{display:flex;justify-content:space-between;font-weight:900}.word{font-size:clamp(32px,10vw,48px);font-weight:1000;color:#456bc5;text-transform:uppercase;margin:7px 0}.prompt{font-weight:900;font-size:19px}.answers{display:grid;gap:9px;margin:11px 0}.ans{text-align:left;background:#fff0ba;transition:.18s}.ans.active{transform:scale(1.035);outline:4px solid #aa91ef;box-shadow:0 7px 18px #806ab855}.ans.correct{background:#bcefc6;outline:4px solid #62c77c}.ans.dim{opacity:.45}.count{height:55px;font-size:46px;font-weight:1000;color:#e66d8b}.status{min-height:25px;font-weight:900}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.controls button{font-size:13px;padding:9px 3px}.learn{background:#e9fff6;border-radius:18px;padding:10px;margin-top:9px}.visual{font-size:52px}.hidden{display:none!important}.gate{position:fixed;inset:0;background:#173e4777;z-index:20;display:flex;align-items:center;justify-content:center;padding:25px}.gate button{font-size:24px;background:#ffdb64;padding:18px 24px}.result{font-size:45px;font-weight:1000;color:#456bc5}
.cham{position:fixed;z-index:2;left:8px;top:8px;width:65px;height:42px;pointer-events:none;animation:edge 17s linear infinite}.body{position:absolute;width:42px;height:28px;border-radius:55%;background:linear-gradient(145deg,#8df0c4,#48c797);box-shadow:inset 5px 5px 8px #fff8,0 5px 8px #477b6960}.eye{position:absolute;width:13px;height:13px;background:white;border-radius:50%;left:8px;top:4px}.eye:after{content:"";position:absolute;width:6px;height:6px;background:#234;border-radius:50%;left:4px;top:3px}.tail{position:absolute;width:28px;height:28px;border:7px solid #59cfa2;border-left-color:transparent;border-radius:50%;left:34px;top:12px}.leg{position:absolute;width:16px;height:5px;background:#50c79a;border-radius:5px}.l1{left:5px;top:27px;transform:rotate(35deg)}.l2{left:24px;top:27px;transform:rotate(-35deg)}.l3{left:6px;top:34px;transform:rotate(-25deg)}.l4{left:25px;top:34px;transform:rotate(25deg)}@keyframes edge{0%{left:8px;top:8px}25%{left:calc(100vw - 75px);top:8px}50%{left:calc(100vw - 75px);top:calc(100dvh - 54px)}75%{left:8px;top:calc(100dvh - 54px)}100%{left:8px;top:8px}}@media(max-height:700px){.card{padding:11px}.answers{gap:6px;margin:7px}.ans{padding:8px 10px}.count{height:37px;font-size:31px}}
</style></head><body><div class="cham"><div class="body"><div class="eye"></div></div><div class="tail"></div><i class="leg l1"></i><i class="leg l2"></i><i class="leg l3"></i><i class="leg l4"></i></div><main class="app">
<section id="cover" class="card cover"><div class="tag">LISTEN & GUESS</div><h1>VOCABULARY<br>CHALLENGE</h1><div class="topic">สัตว์ที่มีพิษ</div><div class="hero">🐍 🦂 🕷️ 🪼</div><div class="tag">50 WORDS • GRADE 1–6</div><p>ฟัง • คิด • 1–2–3 • เฉลย</p></section>
<section id="level" class="card hidden"><h2>เลือกจำนวนคำ</h2><div class="levels"><button onclick="start(20)">20 คำ</button><button onclick="start(30)">30 คำ</button><button onclick="start(40)">40 คำ</button><button onclick="start(50)">50 คำ</button></div></section>
<section id="game" class="card hidden"><div class="top"><span id="prog"></span><span>🎧 LISTEN</span></div><div class="prompt">ข้อใดแปลว่า</div><div id="word" class="word"></div><div id="answers" class="answers"></div><div id="count" class="count"></div><div id="status" class="status"></div><div class="controls"><button onclick="pause()">⏸ หยุด</button><button onclick="resume()">▶ เล่นต่อ</button><button onclick="replay()">🔁 ฟังใหม่</button></div><div id="learn" class="learn hidden"></div></section>
<section id="result" class="card hidden"><h2>🎉 เรียนครบแล้ว!</h2><div id="done" class="result"></div><p>ฟังและเรียนคำศัพท์ครบแล้ว</p><button onclick="showLevels()">🔄 เล่นอีกครั้ง</button></section></main>
<div id="gate" class="gate hidden"><button onclick="unlock()">🔊 แตะเพื่อเริ่มเสียง</button></div>
<script>
const WORDS=[{"word": "snake", "thai": "งู", "phonics": "/sneɪk/", "sentence": "A snake can have venom.", "sentenceThai": "งูบางชนิดมีพิษ", "visual": "🐍"}, {"word": "cobra", "thai": "งูเห่า", "phonics": "/ˈkoʊ.brə/", "sentence": "A cobra is a venomous snake.", "sentenceThai": "งูเห่าเป็นงูมีพิษ", "visual": "🐍"}, {"word": "viper", "thai": "งูไวเปอร์", "phonics": "/ˈvaɪ.pɚ/", "sentence": "A viper has venom.", "sentenceThai": "งูไวเปอร์มีพิษ", "visual": "🐍"}, {"word": "rattlesnake", "thai": "งูหางกระดิ่ง", "phonics": "/ˈræt.əl.sneɪk/", "sentence": "A rattlesnake has a rattle.", "sentenceThai": "งูหางกระดิ่งมีหางที่ส่งเสียงได้", "visual": "🐍"}, {"word": "krait", "thai": "งูทับสมิงคลา", "phonics": "/kraɪt/", "sentence": "A krait is venomous.", "sentenceThai": "งูทับสมิงคลาเป็นงูมีพิษ", "visual": "🐍"}, {"word": "mamba", "thai": "งูแมมบา", "phonics": "/ˈmæm.bə/", "sentence": "A mamba is a venomous snake.", "sentenceThai": "งูแมมบาเป็นงูมีพิษ", "visual": "🐍"}, {"word": "taipan", "thai": "งูไทปัน", "phonics": "/ˈtaɪ.pæn/", "sentence": "A taipan is venomous.", "sentenceThai": "งูไทปันมีพิษ", "visual": "🐍"}, {"word": "coral snake", "thai": "งูปะการัง", "phonics": "/ˈkɔːr.əl sneɪk/", "sentence": "A coral snake is venomous.", "sentenceThai": "งูปะการังเป็นงูมีพิษ", "visual": "🐍"}, {"word": "sea snake", "thai": "งูทะเล", "phonics": "/ˈsiː sneɪk/", "sentence": "A sea snake lives in the sea.", "sentenceThai": "งูทะเลอาศัยอยู่ในทะเล", "visual": "🐍"}, {"word": "scorpion", "thai": "แมงป่อง", "phonics": "/ˈskɔːr.pi.ən/", "sentence": "A scorpion has a stinger.", "sentenceThai": "แมงป่องมีเหล็กใน", "visual": "🦂"}, {"word": "spider", "thai": "แมงมุม", "phonics": "/ˈspaɪ.dɚ/", "sentence": "Some spiders are venomous.", "sentenceThai": "แมงมุมบางชนิดมีพิษ", "visual": "🕷️"}, {"word": "black widow", "thai": "แมงมุมแม่ม่ายดำ", "phonics": "/ˌblæk ˈwɪd.oʊ/", "sentence": "A black widow is venomous.", "sentenceThai": "แมงมุมแม่ม่ายดำมีพิษ", "visual": "🕷️"}, {"word": "funnel-web spider", "thai": "แมงมุมใยกรวย", "phonics": "/ˈfʌn.əl web ˌspaɪ.dɚ/", "sentence": "This spider is venomous.", "sentenceThai": "แมงมุมชนิดนี้มีพิษ", "visual": "🕷️"}, {"word": "centipede", "thai": "ตะขาบ", "phonics": "/ˈsen.t̬ə.piːd/", "sentence": "A centipede can bite.", "sentenceThai": "ตะขาบกัดได้", "visual": "🐛"}, {"word": "bee", "thai": "ผึ้ง", "phonics": "/biː/", "sentence": "A bee can sting.", "sentenceThai": "ผึ้งต่อยได้", "visual": "🐝"}, {"word": "wasp", "thai": "ตัวต่อ", "phonics": "/wɑːsp/", "sentence": "A wasp can sting.", "sentenceThai": "ตัวต่อต่อยได้", "visual": "🐝"}, {"word": "hornet", "thai": "แตน", "phonics": "/ˈhɔːr.nɪt/", "sentence": "A hornet can sting.", "sentenceThai": "แตนต่อยได้", "visual": "🐝"}, {"word": "ant", "thai": "มด", "phonics": "/ænt/", "sentence": "Some ants can sting.", "sentenceThai": "มดบางชนิดต่อยได้", "visual": "🐜"}, {"word": "fire ant", "thai": "มดคันไฟ", "phonics": "/ˈfaɪr ænt/", "sentence": "A fire ant can sting.", "sentenceThai": "มดคันไฟต่อยได้", "visual": "🐜"}, {"word": "jellyfish", "thai": "แมงกะพรุน", "phonics": "/ˈdʒel.i.fɪʃ/", "sentence": "A jellyfish can sting.", "sentenceThai": "แมงกะพรุนทำให้เกิดอาการแสบจากเข็มพิษได้", "visual": "🪼"}, {"word": "box jellyfish", "thai": "แมงกะพรุนกล่อง", "phonics": "/ˈbɑːks ˌdʒel.i.fɪʃ/", "sentence": "A box jellyfish is venomous.", "sentenceThai": "แมงกะพรุนกล่องมีพิษ", "visual": "🪼"}, {"word": "sea anemone", "thai": "ดอกไม้ทะเล", "phonics": "/ˈsiː əˌnem.ə.ni/", "sentence": "A sea anemone has stinging cells.", "sentenceThai": "ดอกไม้ทะเลมีเซลล์เข็มพิษ", "visual": "🌊"}, {"word": "cone snail", "thai": "หอยเต้าปูน", "phonics": "/ˈkoʊn sneɪl/", "sentence": "A cone snail is venomous.", "sentenceThai": "หอยเต้าปูนมีพิษ", "visual": "🐚"}, {"word": "blue-ringed octopus", "thai": "หมึกสายวงน้ำเงิน", "phonics": "/ˌbluː rɪŋd ˈɑːk.tə.pəs/", "sentence": "This octopus is venomous.", "sentenceThai": "หมึกสายวงน้ำเงินมีพิษ", "visual": "🐙"}, {"word": "stonefish", "thai": "ปลาหิน", "phonics": "/ˈstoʊn.fɪʃ/", "sentence": "A stonefish has venomous spines.", "sentenceThai": "ปลาหินมีก้านครีบที่มีพิษ", "visual": "🐟"}, {"word": "lionfish", "thai": "ปลาสิงโต", "phonics": "/ˈlaɪ.ən.fɪʃ/", "sentence": "A lionfish has venomous spines.", "sentenceThai": "ปลาสิงโตมีก้านครีบที่มีพิษ", "visual": "🐠"}, {"word": "stingray", "thai": "ปลากระเบนมีเงี่ยง", "phonics": "/ˈstɪŋ.reɪ/", "sentence": "A stingray has a sharp spine.", "sentenceThai": "ปลากระเบนมีเงี่ยงแหลม", "visual": "🐟"}, {"word": "pufferfish", "thai": "ปลาปักเป้า", "phonics": "/ˈpʌf.ɚ.fɪʃ/", "sentence": "A pufferfish can be poisonous.", "sentenceThai": "ปลาปักเป้าบางชนิดมีพิษ", "visual": "🐡"}, {"word": "poison dart frog", "thai": "กบลูกดอกพิษ", "phonics": "/ˈpɔɪ.zən dɑːrt frɑːɡ/", "sentence": "This frog can be poisonous.", "sentenceThai": "กบชนิดนี้มีสารพิษ", "visual": "🐸"}, {"word": "toad", "thai": "คางคก", "phonics": "/toʊd/", "sentence": "Some toads have toxins.", "sentenceThai": "คางคกบางชนิดมีสารพิษ", "visual": "🐸"}, {"word": "newt", "thai": "นิวต์", "phonics": "/nuːt/", "sentence": "Some newts have toxins.", "sentenceThai": "นิวต์บางชนิดมีสารพิษ", "visual": "🦎"}, {"word": "platypus", "thai": "ตุ่นปากเป็ด", "phonics": "/ˈplæt̬.ɪ.pəs/", "sentence": "A male platypus has a venomous spur.", "sentenceThai": "ตุ่นปากเป็ดตัวผู้มีเดือยพิษ", "visual": "🦫"}, {"word": "slow loris", "thai": "นางอาย", "phonics": "/ˌsloʊ ˈlɔːr.ɪs/", "sentence": "A slow loris has a toxic bite.", "sentenceThai": "นางอายมีสารพิษที่เกี่ยวข้องกับการกัด", "visual": "🐒"}, {"word": "venom", "thai": "พิษที่ฉีดเข้าสู่ร่างกาย", "phonics": "/ˈven.əm/", "sentence": "Venom can enter through a bite or sting.", "sentenceThai": "พิษชนิดนี้เข้าสู่ร่างกายผ่านการกัดหรือต่อยได้", "visual": "💧"}, {"word": "poison", "thai": "สารพิษ", "phonics": "/ˈpɔɪ.zən/", "sentence": "Poison can make an animal sick.", "sentenceThai": "สารพิษทำให้สัตว์ป่วยได้", "visual": "☠️"}, {"word": "toxin", "thai": "สารพิษ", "phonics": "/ˈtɑːk.sɪn/", "sentence": "A toxin is a poisonous substance.", "sentenceThai": "ท็อกซินคือสารที่เป็นพิษ", "visual": "⚠️"}, {"word": "venomous", "thai": "มีพิษจากการกัดหรือต่อย", "phonics": "/ˈven.ə.məs/", "sentence": "A cobra is venomous.", "sentenceThai": "งูเห่ามีพิษจากการกัด", "visual": "🐍"}, {"word": "poisonous", "thai": "เป็นพิษเมื่อสัมผัสหรือกิน", "phonics": "/ˈpɔɪ.zən.əs/", "sentence": "Some frogs are poisonous.", "sentenceThai": "กบบางชนิดมีสารพิษ", "visual": "🐸"}, {"word": "bite", "thai": "กัด", "phonics": "/baɪt/", "sentence": "Some snakes can bite.", "sentenceThai": "งูบางชนิดกัดได้", "visual": "🦷"}, {"word": "sting", "thai": "ต่อยหรือแทงด้วยเหล็กใน", "phonics": "/stɪŋ/", "sentence": "A bee can sting.", "sentenceThai": "ผึ้งต่อยได้", "visual": "🐝"}, {"word": "stinger", "thai": "เหล็กใน", "phonics": "/ˈstɪŋ.ɚ/", "sentence": "A scorpion has a stinger.", "sentenceThai": "แมงป่องมีเหล็กใน", "visual": "🦂"}, {"word": "fang", "thai": "เขี้ยว", "phonics": "/fæŋ/", "sentence": "A snake has fangs.", "sentenceThai": "งูมีเขี้ยว", "visual": "🦷"}, {"word": "spine", "thai": "เงี่ยงหรือก้านครีบแหลม", "phonics": "/spaɪn/", "sentence": "Some fish have sharp spines.", "sentenceThai": "ปลาบางชนิดมีเงี่ยงแหลม", "visual": "🐟"}, {"word": "warning", "thai": "คำเตือน", "phonics": "/ˈwɔːr.nɪŋ/", "sentence": "A warning tells us to be careful.", "sentenceThai": "คำเตือนบอกให้เราระวัง", "visual": "⚠️"}, {"word": "danger", "thai": "อันตราย", "phonics": "/ˈdeɪn.dʒɚ/", "sentence": "Stay away from danger.", "sentenceThai": "อยู่ห่างจากอันตราย", "visual": "🚧"}, {"word": "safe", "thai": "ปลอดภัย", "phonics": "/seɪf/", "sentence": "Stay in a safe place.", "sentenceThai": "อยู่ในที่ปลอดภัย", "visual": "🛡️"}, {"word": "careful", "thai": "ระมัดระวัง", "phonics": "/ˈker.fəl/", "sentence": "Be careful near wild animals.", "sentenceThai": "ระมัดระวังเมื่ออยู่ใกล้สัตว์ป่า", "visual": "👀"}, {"word": "avoid", "thai": "หลีกเลี่ยง", "phonics": "/əˈvɔɪd/", "sentence": "Avoid touching wild animals.", "sentenceThai": "หลีกเลี่ยงการสัมผัสสัตว์ป่า", "visual": "✋"}, {"word": "distance", "thai": "ระยะห่าง", "phonics": "/ˈdɪs.təns/", "sentence": "Keep a safe distance.", "sentenceThai": "รักษาระยะห่างที่ปลอดภัย", "visual": "↔️"}, {"word": "habitat", "thai": "ถิ่นอาศัย", "phonics": "/ˈhæb.ə.tæt/", "sentence": "Animals live in different habitats.", "sentenceThai": "สัตว์อาศัยในถิ่นที่อยู่ต่างกัน", "visual": "🌿"}];let qs=[],idx=0,opts=[],correct=0,run=0,timers=[],paused=false,requestedN=20;
const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function wait(ms){return new Promise(r=>{let id=setTimeout(r,ms);timers.push(id)})}
function stop(){run++;timers.forEach(clearTimeout);timers=[];if("speechSynthesis"in window)speechSynthesis.cancel()}
function hide(){["cover","level","game","result"].forEach(x=>$(x).classList.add("hidden"))}
function showLevels(){stop();hide();$("level").classList.remove("hidden")}
function getVoice(lang){let vs=speechSynthesis.getVoices();return vs.find(v=>v.lang===lang)||vs.find(v=>v.lang.startsWith(lang.slice(0,2)))||null}
function say(text,lang,rate=.9,r=run){return new Promise(res=>{if(r!==run)return res();if(!("speechSynthesis"in window))return setTimeout(res,450);let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;let v=getVoice(lang);if(v)u.voice=v;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
function start(n){requestedN=n;stop();qs=shuffle(WORDS).slice(0,n);idx=0;hide();$("game").classList.remove("hidden");render()}
function render(){stop();let q=qs[idx];$("prog").textContent=`ข้อ ${idx+1} / ${qs.length}`;$("word").textContent=q.word;$("count").textContent="";$("status").textContent="กำลังอ่านโจทย์...";$("learn").classList.add("hidden");let bad=shuffle(WORDS.filter(x=>x.word!==q.word&&x.thai!==q.thai)).slice(0,3);opts=shuffle([q,...bad]);correct=opts.findIndex(x=>x.word===q.word);$("answers").innerHTML=opts.map((x,j)=>`<button class="ans">${j+1}. ${x.thai}</button>`).join("");sequence(run)}
function active(j){document.querySelectorAll(".ans").forEach((x,k)=>x.classList.toggle("active",k===j))}
async function sequence(r){let q=qs[idx];await say("ข้อใดแปลว่า","th-TH",.9,r);if(r!==run)return;await say(q.word,"en-US",.82,r);if(r!==run)return;await wait(180);for(let j=0;j<4;j++){if(r!==run)return;active(j);await say(`ข้อ ${j+1} ${opts[j].thai}`,"th-TH",.88,r);await wait(100)}active(-1);if(r!==run)return;await say("คิดดูนะ","th-TH",.9,r);for(let n=1;n<=3;n++){if(r!==run)return;$("count").textContent=n;await say(["","หนึ่ง","สอง","สาม"][n],"th-TH",.84,r);await wait(120)}if(r!==run)return;$("count").textContent="";await say("เฉลย","th-TH",.9,r);if(r!==run)return;await say(`ข้อ ${correct+1} ${q.thai}`,"th-TH",.87,r);if(r!==run)return;reveal(q);await wait(1000);if(r!==run)return;idx++;if(idx<qs.length)render();else finish()}
function reveal(q){document.querySelectorAll(".ans").forEach((x,j)=>{if(j===correct){x.classList.add("correct");x.textContent="✅ "+x.textContent}else x.classList.add("dim")});$("status").textContent=`เฉลย: ข้อ ${correct+1} ${q.thai}`;$("learn").classList.remove("hidden");$("learn").innerHTML=`<div class="visual">${q.visual}</div><b>${q.word.toUpperCase()} = ${q.thai}</b><div>🔤 ${q.phonics}</div><div>${q.sentence}<br><small>${q.sentenceThai}</small></div>`}
function replay(){render()}function pause(){if("speechSynthesis"in window)speechSynthesis.pause();paused=true;$("status").textContent="⏸ หยุดชั่วคราว"}function resume(){if("speechSynthesis"in window&&paused)speechSynthesis.resume();paused=false}
function finish(){stop();hide();$("result").classList.remove("hidden");$("done").textContent=`${qs.length} / ${qs.length} WORDS`}
function unlock(){$("gate").classList.add("hidden");showLevels();if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance("");speechSynthesis.speak(u)}}
setTimeout(()=>{hide();$("level").classList.remove("hidden");$("gate").classList.remove("hidden")},2000);
if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
</script></body></html>
